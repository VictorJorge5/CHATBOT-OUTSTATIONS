<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outstations Support Hub — Iberia DTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --shell:#0F1419;
    --shell-2:#1A222B;
    --shell-3:#28323D;
    --ink:#111820;
    --ink-2:#414C58;
    --muted:#78838F;
    --line:#E1E6EB;
    --line-soft:#EDF1F4;
    --paper:#FFFFFF;
    --canvas:#F4F6F8;
    --red:#C8102E;
    --red-dk:#96001F;
    --red-wash:#FCF0F2;
    --gold:#E0A526;
    --ok:#2F9E5E;
    --r:3px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Barlow',system-ui,sans-serif;
    font-size:15px;line-height:1.5;
    color:var(--ink);background:var(--shell);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ============ LANGUAGE SWITCH ============ */
  .lang-switch{display:flex;gap:4px;}
  .lang-switch button{
    background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.3);
    color:rgba(255,255,255,0.8);font-family:inherit;font-size:11.5px;font-weight:700;
    letter-spacing:0.03em;padding:4px 8px;border-radius:3px;cursor:pointer;
  }
  .lang-switch button.active{background:#fff;color:var(--red-dk);border-color:#fff;}
  .lang-switch button:hover:not(.active){background:rgba(255,255,255,0.22);}

  /* ============ GATE ============ */
  #gate{
    position:fixed;inset:0;z-index:50;
    background:var(--canvas);color:var(--ink);
    display:flex;flex-direction:column;
    overflow-y:auto;
  }
  .gate-topbar{
    flex-shrink:0;
    background:var(--red);color:#fff;
    padding:16px 24px;
    display:flex;align-items:center;gap:14px;
  }
  .gate-topbar b{font-size:14px;font-weight:700;letter-spacing:0.1em;}
  .gate-topbar span{font-size:13px;color:rgba(255,255,255,0.82);}
  .gate-topbar .spacer{flex:1;}
  .brand-logo{height:24px;width:auto;display:block;}

  .gate-body{
    flex:1;
    width:100%;max-width:960px;margin:0 auto;
    padding:56px 40px 64px;
    display:flex;flex-direction:column;align-items:center;
    gap:36px;
  }

  .gate-intro{text-align:center;}
  .gate-intro h1{
    margin:0;font-size:40px;line-height:1.08;font-weight:700;
    letter-spacing:-0.02em;color:var(--ink);
  }
  .gate-intro h1 span{color:var(--red);display:block;}
  .gate-lede{
    margin:18px auto 0;font-size:16px;line-height:1.6;color:var(--ink-2);max-width:36ch;
  }
  .gate-skip{}
  .gate-skip button{
    background:none;border:0;padding:0;font-family:inherit;
    font-size:12.5px;font-weight:600;color:var(--muted);
    text-decoration:underline;text-decoration-color:var(--line);
    text-underline-offset:3px;cursor:pointer;white-space:nowrap;
  }
  .gate-skip button:hover{color:var(--red);text-decoration-color:var(--red);}
  .gate-footer{
    flex-shrink:0;
    padding:16px 40px 20px;text-align:right;
    font-size:12px;color:var(--muted);letter-spacing:0.02em;
  }

  .gate-card{
    width:100%;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 1px 2px rgba(17,24,32,0.04), 0 12px 32px -12px rgba(17,24,32,0.10);
    overflow:hidden;
  }
  .gate-card-head{
    padding:18px 24px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;
  }
  .gate-card-head b{font-size:14.5px;font-weight:600;color:var(--ink);}
  .gate-card-head span{font-size:12.5px;color:var(--muted);}
  .sta-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
    gap:8px;
    padding:20px 24px 24px;
  }
  .flag{vertical-align:-2px;border-radius:2px;margin-right:2px;}
  .sta-chip{
    font-family:'Barlow Condensed',sans-serif;
    font-size:15px;font-weight:600;letter-spacing:0.06em;
    color:var(--ink-2);background:var(--canvas);
    border:1px solid var(--line);border-radius:5px;
    padding:10px 0;text-align:center;cursor:pointer;
    transition:color .12s,background .12s,border-color .12s;
  }
  .sta-chip:hover{color:var(--red-dk);background:var(--red-wash);border-color:var(--red);}
  .sta-chip:focus-visible{outline:2px solid var(--red);outline-offset:-2px;}

  @media (max-width:820px){
    .gate-topbar{padding:14px 16px;}
    .gate-footer{padding:12px 16px 16px;}
    .gate-body{padding:36px 20px 48px;gap:28px;}
    .gate-intro h1{font-size:32px;}
  }

  /* ============ DESK ============ */
  #desk{display:none;height:100vh;height:100dvh;flex-direction:column;}
  #desk.on{display:flex;}

  .topbar{
    background:var(--red);color:#fff;
    display:flex;align-items:center;gap:20px;
    padding:0 24px;height:56px;flex-shrink:0;
    border-bottom:1px solid var(--red-dk);
  }
  .topbar .mark{
    font-size:12.5px;letter-spacing:0.06em;font-weight:600;
  }
  .brand-logo-dark{height:24px;width:auto;display:block;}
  .topbar .sep{width:1px;height:22px;background:rgba(255,255,255,0.3);}
  .topbar .desk-name{font-size:14px;color:rgba(255,255,255,0.82);}
  .topbar .spacer{flex:1;}
  .sta-badge{
    display:flex;align-items:center;gap:10px;
    background:rgba(0,0,0,0.18);border:1px solid rgba(255,255,255,0.25);
    border-radius:var(--r);padding:5px 12px;
  }
  .sta-badge .code{
    font-family:'Barlow Condensed',sans-serif;
    font-size:20px;font-weight:600;letter-spacing:0.1em;color:#fff;
  }
  .sta-badge .kind{font-size:11.5px;color:rgba(255,255,255,0.75);line-height:1.2;}
  .switch{
    background:none;border:0;font-family:inherit;font-size:12.5px;
    color:rgba(255,255,255,0.75);text-decoration:underline;text-underline-offset:3px;cursor:pointer;
  }
  .switch:hover{color:#fff;}

  .grid{
    flex:1;display:grid;
    grid-template-columns:250px 1fr 288px;
    min-height:0;background:var(--paper);
  }

  /* ---- index ---- */
  .topics-toggle{display:none;}
  .index{background:var(--canvas);border-right:1px solid var(--line);overflow-y:auto;padding:18px 0;}
  .sect{
    font-size:11.5px;font-weight:600;color:var(--ink-2);
    padding:0 18px 10px;
  }
  .topic{
    display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:start;
    width:100%;text-align:left;background:none;border:0;
    border-top:1px solid var(--line-soft);
    padding:10px 18px;font-family:inherit;font-size:13.5px;line-height:1.35;
    color:var(--ink);cursor:pointer;transition:background .12s;
  }
  .topic:last-of-type{border-bottom:1px solid var(--line-soft);}
  .topic:hover{background:#E9EDF1;}
  .topic:focus-visible{outline:2px solid var(--red);outline-offset:-2px;}
  .topic .c{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:0.04em;color:var(--red);padding-top:2px;
  }

  /* ---- thread ---- */
  .thread-col{display:flex;flex-direction:column;min-height:0;}
  .thread{flex:1;overflow-y:auto;padding:24px 28px 6px;display:flex;flex-direction:column;gap:16px;}
  .msg{max-width:64ch;font-size:14.5px;line-height:1.6;}
  .msg.bot{align-self:flex-start;}
  .msg.user{
    align-self:flex-end;background:var(--ink);color:#fff;
    padding:8px 13px;border-radius:var(--r);max-width:50ch;
  }
  .msg.bot .body{
    background:var(--paper);border:1px solid var(--line);
    border-left:3px solid var(--red);border-radius:var(--r);padding:13px 15px;
  }
  .msg.bot .step-label{
    display:block;font-family:'IBM Plex Mono',monospace;
    font-size:10px;font-weight:600;letter-spacing:0.05em;
    color:var(--gold);margin-bottom:6px;
  }
  .msg.bot a{color:var(--red);text-decoration:underline;text-underline-offset:2px;}
  .msg.bot a:hover{color:var(--red-dk);}
  .msg ol,.msg ul{margin:8px 0 0;padding-left:19px;}
  .msg li{margin-bottom:5px;}
  .msg .note{
    margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);
    font-size:12.5px;color:var(--muted);
  }
  .choices{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
  .choices button{
    background:var(--paper);border:1px solid var(--red);color:var(--red-dk);
    padding:6px 12px;border-radius:var(--r);font-family:inherit;
    font-size:13px;font-weight:500;cursor:pointer;transition:background .12s;
  }
  .choices button:hover{background:var(--red-wash);}
  .choices button:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

  .thinking{display:none;align-items:center;gap:5px;padding:0 28px 8px;color:var(--muted);font-size:13px;}
  .thinking i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:p 1.1s ease-in-out infinite;}
  .thinking i:nth-child(2){animation-delay:.15s;}
  .thinking i:nth-child(3){animation-delay:.3s;}
  @keyframes p{0%,100%{opacity:.25;}50%{opacity:1;}}

  .composer{border-top:1px solid var(--line);padding:13px 28px 15px;flex-shrink:0;}
  .field{display:flex;gap:9px;}
  .field input{
    flex:1;font-family:inherit;font-size:15px;color:var(--ink);
    background:var(--canvas);border:1px solid var(--line);
    border-radius:var(--r);padding:11px 13px;
  }
  .field input:focus{outline:none;border-color:var(--red);background:var(--paper);}
  .field button{
    font-family:inherit;font-size:14px;font-weight:600;color:#fff;
    background:var(--red);border:0;border-radius:var(--r);
    padding:11px 21px;cursor:pointer;transition:background .12s;
  }
  .field button:hover:not(:disabled){background:var(--red-dk);}
  .field button:disabled{opacity:.45;cursor:default;}

  /* ---- context ---- */
  .ctx{background:var(--canvas);border-left:1px solid var(--line);overflow-y:auto;padding:18px;}
  .card{
    background:var(--paper);border:1px solid var(--line);
    border-radius:var(--r);padding:14px;margin-bottom:14px;
  }
  .card .sta-big{
    font-family:'Barlow Condensed',sans-serif;
    font-size:42px;font-weight:600;letter-spacing:0.08em;
    line-height:1;color:var(--ink);
  }
  .kindtag{
    display:inline-block;margin-top:8px;font-size:11.5px;font-weight:600;
    padding:3px 8px;border-radius:var(--r);
  }
  .kindtag.generic{background:#FFF4DC;color:#8A6100;}
  .kindtag.domain{background:#E8F3EC;color:#1D6B3F;}
  .row{margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft);}
  .row .k{font-size:11.5px;color:var(--muted);margin-bottom:3px;}
  .row .v{font-size:13.5px;font-weight:500;word-break:break-all;}
  .copy{
    margin-top:6px;background:none;border:1px solid var(--line);
    border-radius:var(--r);padding:4px 9px;font-family:inherit;
    font-size:11.5px;color:var(--ink-2);cursor:pointer;
  }
  .copy:hover{border-color:var(--red);color:var(--red);}
  .ctx h3{
    font-size:11.5px;font-weight:600;color:var(--ink-2);
    margin:0 0 9px;
  }
  .ref{font-size:13px;line-height:1.55;}
  .ref div{margin-bottom:9px;}
  .ref .k{font-size:11.5px;color:var(--muted);}
  .ref a{color:var(--red);text-decoration:none;}
  .ref a:hover{text-decoration:underline;}

  /* ---- responsive ---- */
  @media (max-width:1060px){
    .grid{grid-template-columns:220px 1fr;}
    .ctx{display:none;}
  }
  @media (max-width:780px){
    .grid{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;}
    .topics-toggle{
      display:flex;align-items:center;justify-content:space-between;
      width:100%;background:var(--red-wash);border:0;
      border-bottom:2px solid var(--red);
      padding:14px 16px;font-family:inherit;font-size:15px;font-weight:700;
      color:var(--red-dk);cursor:pointer;
    }
    .topics-toggle .chev{transition:transform .15s;color:var(--red);font-weight:700;}
    .topics-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
    .index{
      display:none;
      border-right:0;border-bottom:1px solid var(--line);
      flex-wrap:wrap;gap:7px;
      padding:11px 14px;
    }
    .index.open{display:flex;}
    .sect{display:none;}
    .topic{
      display:block;width:auto;flex-shrink:0;
      border:1px solid var(--line);border-radius:var(--r);
      background:var(--paper);padding:8px 11px;
    }
    .topic .c{display:block;padding-top:0;margin-bottom:3px;}
    .thread{padding:18px 14px 6px;}
    .composer{padding:11px 14px 13px;}
    .thinking{padding-left:14px;}
    .topbar{gap:12px;padding:0 16px;}
    .topbar .desk-name,.topbar .sep{display:none;}
    .msg.user{max-width:82%;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<!-- ========== ENTRY ========== -->
<div id="gate">
  <div class="gate-topbar">
    <b>IBERIA</b><span>Dirección Técnica del Operador · Outstations</span>
    <span class="spacer"></span>
    <div class="lang-switch" id="langSwitchGate"></div>
  </div>
  <div class="gate-body">
    <div class="gate-intro">
      <h1>Outstations<span>Support Hub</span></h1>
      <p class="gate-lede" id="gateLede"></p>
    </div>
    <div class="gate-card">
      <div class="gate-card-head"><b id="selectStationLbl"></b><span class="gate-skip"><button id="staSkip"></button></span></div>
      <div class="sta-grid" id="staGrid"></div>
    </div>
  </div>
  <div class="gate-footer">IBERIA L.A.E. — Dirección Técnica del Operador</div>
</div>

<!-- ========== DESK ========== -->
<div id="desk">
  <div class="topbar">
    <span class="mark">IBERIA</span>
    <span class="sep"></span>
    <span class="desk-name">Outstations Support Hub</span>
    <span class="spacer"></span>
    <div class="lang-switch" id="langSwitchDesk"></div>
    <div class="sta-badge" id="staBadge"></div>
    <button class="switch" id="switchSta"></button>
  </div>

  <div class="grid">
    <button class="topics-toggle" id="topicsToggle" aria-expanded="false"><span id="topicsToggleLbl"></span><span class="chev">▾</span></button>
    <nav class="index" aria-label="Common issues" id="topicNav">
      <div class="sect" id="commonIssuesLbl"></div>
    </nav>

    <div class="thread-col">
      <div class="thread" id="thread" role="log" aria-live="polite"></div>
      <div class="thinking" id="thinking"><i></i><i></i><i></i></div>
      <div class="composer">
        <div class="field">
          <input type="text" id="freeInput" aria-label="Describe your problem">
          <button id="sendBtn"></button>
        </div>
      </div>
    </div>

    <aside class="ctx">
      <div class="card" id="staCard"></div>
      <h3 id="quickRefLbl"></h3>
      <div class="ref">
        <div><div class="k" id="orgCodeLbl"></div>IBCM</div>
        <div><div class="k" id="itHelpdeskLbl"></div>+34 915 874 700<br><a href="mailto:ssi@iberia.es">ssi@iberia.es</a></div>
        <div><div class="k">DTO Outstations</div><a href="mailto:OutstationsIBOperator@iberia.es">OutstationsIBOperator@iberia.es</a></div>
        <div><div class="k">MAINTROL (OTP)</div>+34 91 318 93 00<br><a href="mailto:MAINTROL@iberia.es">MAINTROL@iberia.es</a></div>
      </div>
    </aside>
  </div>
</div>

  authenticatorLinkedNo:'No, it is not linked',
  selfServiceReset:'Reset it yourself at <a href="https://passwordreset.microsoftonline.com/" target="_blank" rel="noopener">passwordreset.microsoftonline.com</a>, approving the notification on your phone.',
  helpdeskIntroUnpair:'Without the phone linked to your MFA, and without your Iberia Domain password, this goes through the helpdesk:',
  helpdeskIntroPlain:'Without Authenticator linked, you need a temporary password from the helpdesk:',
  helpdeskFirstUnpair:'<li>Call <b>+34 915 874 700</b>, Iberia option. Identify yourself with your Iberia Domain user and ask for <b>both</b>: unpairing your old Authenticator device, <b>and</b> a temporary password. Do not mention AMOS or ContentManager365.</li>',
  helpdeskFirstPlain:'<li>Call <b>+34 915 874 700</b>, Iberia option. Identify yourself with your Iberia Domain user and ask for a temporary password. Do not mention AMOS or ContentManager365.</li>',
  helpdeskRest:'<li>The temporary password only lets you set a new one. It opens no application.</li><li>Sign in at <a href="https://account.microsoft.com/account/" target="_blank" rel="noopener">account.microsoft.com/account</a> with your Domain user and that password. You will be asked to set a new password and link Authenticator: install the app, tap <b>+</b>, choose <b>Work or school account</b>, scan the QR code.</li><li>Open a private window and sign in again with the new password.</li><li>In <b>Security info</b>, delete the temporary password line.</li><li>From then on you reset your own password at <a href="https://passwordreset.microsoftonline.com/" target="_blank" rel="noopener">passwordreset.microsoftonline.com</a>.</li>',

  docunetWhoGeneric:(acc)=>`the shared account <b>${acc}</b>`,
  docunetWhoDomain:'your Iberia Domain user',
  docunetResetGeneric:'<li>Forgotten password? Entering the Organisation Code and Username reveals the password field, with an <b>I forgot my password</b> link underneath — click it for a new password by email.</li>',
  docunetResetDomain:'<li>Forgotten password? Reset it yourself at <a href="https://passwordreset.microsoftonline.com/" target="_blank" rel="noopener">passwordreset.microsoftonline.com</a> if Authenticator is linked to your account; otherwise call <b>+34 915 874 700</b> (Iberia option) for a temporary password.</li>',
  docunetMain:(who,resetLine)=>`This also covers <i>ID not recognized</i>, <i>authenticated by your identity provider but could not be found</i>, and <i>no permission — contact your administrator</i>. In all three, the browser has usually signed you in with the wrong Microsoft account.<ol><li>Open a private or incognito window, so the browser does not reuse an account you already have open.</li><li>Go to <a href="https://login.vistair.com/login" target="_blank" rel="noopener">login.vistair.com/login</a>.</li><li>Organisation Code <b>IBCM</b>. The old IBE code no longer works.</li><li>Sign in with ${who} — not your own company email.</li>${resetLine}<li>Locked out after failed attempts? It clears by itself after 15 minutes.</li></ol>`,
  docunetNeedsSupport:'Since the self-service reset did not fix it, this needs a closer look from support.',

  etlbNoDomain:'Your station has no Iberia Domain account, so e-TLB (Aviatar) is never a direct sign-in here — you always request a one-time password from MAINTROL to certify:<ul><li>Phone +34 91 318 93 00 / 01 / 02, or +34 680 99 46 06</li><li>Email <a href="mailto:MAINTROL@iberia.es">MAINTROL@iberia.es</a></li></ul>Give the aircraft tail number, and the certifier name and email (must be your personal company email, not the generic one for the station).',
  etlbDomainQ:'e-TLB (Aviatar) uses the same Iberia Domain login as ContentManager365 or AirnavX — select <b>Sign in for Iberia</b>. Which is it?',
  etlbSignInProblem:'A sign-in problem',
  etlbNoDomainUser:'I have no Domain user for e-TLB',
  etlbSignInForIberiaQ:'Are you selecting <b>"Sign in for Iberia"</b> in Aviatar when trying to access e-TLB?',
  yes:'Yes',
  noNotSure:'No / not sure',
  etlbMakeSure:'Make sure to select <b>"Sign in for Iberia"</b> specifically in Aviatar, then try again.',

  amosMsg:'For external Part-145 organisations, AMOS accounts are deactivated automatically after 3 months without use. That is almost always the cause.<ol><li>Submit a <a href="https://ibcolumbus.service-now.com/esc?id=sc_cat_item&sys_id=4ceb35932b62a6107924f142de91bfb4" target="_blank" rel="noopener">request for AMOS reactivation</a>.</li><li>If it still fails after reactivation, or the access was never set up, write to <a href="mailto:OutstationsIBOperator@iberia.es">OutstationsIBOperator@iberia.es</a>.</li></ol>',

  onboardingMsg:'Setting up a personal Iberia Domain account for the first time:<ol><li>You should receive two automated emails from <b>seginf@iberia.es</b> with your Domain user and a temporary password. Check the spam folder.</li><li>Sign in at <a href="https://account.microsoft.com/account/" target="_blank" rel="noopener">account.microsoft.com/account</a>. You will be asked to set a new password and link Authenticator: install the app, tap <b>+</b>, choose <b>Work or school account</b>, scan the QR code.</li><li>Open a private window and sign in again with the new password.</li><li>In <b>Security info</b>, delete the temporary password line.</li><li>Open ContentManager365 with Organisation Code <b>IBCM</b> and complete the mandatory Read &amp; Sign. Manuals, InfoNotes and the other applications are reached from there.</li></ol>If the temporary password expires first, call <b>+34 915 874 700</b> (Iberia option) for a new one.',

  otpMsg:'If a certifier has no Iberia Domain user, or the aircraft tablet has no connectivity, request a one-time password from MAINTROL:<ul><li>Phone +34 91 318 93 00 / 01 / 02, or +34 680 99 46 06</li><li>Email <a href="mailto:MAINTROL@iberia.es">MAINTROL@iberia.es</a></li></ul>Give the aircraft tail number, and the certifier name and email (must be your personal company email, not the generic one for the station).',

  viewerMsg:'To read ContentManager365 manuals without a connection:<ol><li>Install <b>DocuNet Viewer</b> from the App Store or Google Play.</li><li>While on Wi-Fi or mobile data, download the manuals you need. They stay available offline.</li></ol>For online reading, use the DocuNet Viewer link provided by Iberia — nothing to install.',
  viewerSharedNote:(code)=>`<div class="note">Docunet at your station shares one account, so a lockout affects everyone at ${code}.</div>`,

  userMgmtMsg:'New users and removals go through the Users Management form in ContentManager365/Docunet (must be requested by someone with Iberia Domain and access to Docunet):<ol><li>Open a private or incognito window, so the browser does not reuse an account you already have open.</li><li>Go to <a href="https://docunet-online.vistair.com/" target="_blank" rel="noopener">ContentManager365 (Docunet)</a>.</li><li>Navigate the folders: <b>IBERIA</b> &gt; <b>CAMO MANUALS &amp; PROCEDURES</b> &gt; <b>Special Procedures and Forms for external MRO\'s</b> &gt; <b>Forms</b> &gt; <b>Users Management</b>.</li><li>Fill in and submit the form with the required details.</li></ol>',
  userMgmtStillNot:'Contact us directly, not the IT Helpdesk, for this: <a href="mailto:OutstationsIBOperator@iberia.es">OutstationsIBOperator@iberia.es</a>.',

  greetScopeNote:'Este servicio cubre únicamente el acceso a los sistemas de Iberia. Para procedimientos de mantenimiento, aeronavegabilidad o documentación de la aeronave, consulta el LSHM o contacta con MAINTROL.',
  greetGeneric:(acc)=>`Docunet en tu estación se inicia con <b>${acc}</b>, código de organización <b>IBCM</b>. Elige una incidencia a la izquierda, o describe el problema abajo.`,

  gotIt:'Entendido',
  accountIsWorking:'La cuenta ya funciona',
  escalateMsg:'Aquí tienes a quién contactar:<ul><li>Restablecimiento de contraseña o de AMOS — <b>Soporte de IT de Iberia</b>, +34 915 874 700 o <a href="mailto:ssi@iberia.es">ssi@iberia.es</a></li><li>Cualquier otra cosa sobre tu estación — <a href="mailto:outstationsiboperator@iberia.es">outstationsiboperator@iberia.es</a></li></ul>',
  etlbEscalateMsg:'Para incidencias de e-TLB, contacta aquí — no con el Soporte de IT general:<ul><li>Para una OTP o problemas de conectividad de la tablet — <b>MAINTROL</b>: teléfono +34 91 318 93 00 / 01 / 02, o +34 680 99 46 06, correo <a href="mailto:MAINTROL@iberia.es">MAINTROL@iberia.es</a></li><li>Para revisar la cuenta o el acceso en sí — <a href="mailto:OutstationsIBOperator@iberia.es">OutstationsIBOperator@iberia.es</a></li></ul>',
  noMatchMsg:'Esto no coincide con ninguna incidencia de este servicio. Aquí tienes a quién contactar:<ul><li>Restablecimiento de contraseña o de AMOS — <b>Soporte de IT de Iberia</b>, +34 915 874 700 o <a href="mailto:ssi@iberia.es">ssi@iberia.es</a></li><li>Cualquier otra cosa sobre tu estación — <a href="mailto:outstationsiboperator@iberia.es">outstationsiboperator@iberia.es</a></li></ul>',

  authQ:'¿Todavía tienes tu teléfono anterior, con Microsoft Authenticator funcionando en él?',
  authYes:'Sí, todavía lo tengo',
  authNoKnowPw:'No, pero sé mi contraseña',
  authNoForgotPw:'No, y he olvidado mi contraseña',
  authSelfService:'Puedes hacerlo tú mismo:<ol><li>Ve a <a href="https://myaccount.microsoft.com/" target="_blank" rel="noopener">myaccount.microsoft.com</a> e inicia sesión con tu usuario de Dominio Iberia.</li><li>Abre <b>Información de seguridad</b>.</li><li>Selecciona <b>Agregar método de inicio de sesión</b>.</li><li>Instala Microsoft Authenticator en el teléfono nuevo, pulsa <b>+</b>, elige <b>Cuenta profesional o educativa</b>, y escanea el código QR en pantalla.</li><li>Cuando el teléfono nuevo funcione, elimina la línea del dispositivo antiguo.</li></ol>',
  authUnpair:'Primero IT tiene que desemparejar el dispositivo antiguo.<ol><li>Abre <a href="https://ibcolumbus.service-now.com/esc?id=sc_cat_item&table=sc_cat_item&sys_id=31d43c163b6972901baf6424c3e45aa9&recordUrl=com.glideapp.servicecatalog_cat_item_view.do%3Fv%3D1&sysparm_id=31d43c163b6972901baf6424c3e45aa9" target="_blank" rel="noopener">Desemparejar dispositivo de Microsoft Authenticator</a> y envía la solicitud.</li><li>Una vez desemparejado, inicia sesión con tu contraseña habitual.</li><li>Se te pedirá entonces registrar el teléfono nuevo.</li></ol>',

  twoLoginsQ:'Tu estación tiene dos accesos distintos. ¿A cuál de los dos se refiere esto?',
  docunetChoice:(acc)=>`Docunet (${acc})`,
  personalDomainChoice:'Mi cuenta personal de Dominio (AMOS / e-TLB)',
  vistairResetMsg:(acc)=>`Esta cuenta es un acceso de Vistair, no de Microsoft, así que se restablece en la propia página de Vistair:<ol><li>Ve a <a href="https://login.vistair.com/login" target="_blank" rel="noopener">login.vistair.com/login</a>.</li><li>Introduce el Código de organización <b>IBCM</b> y el Usuario <b>${acc}</b>.</li><li>Aparece el campo de contraseña, con un enlace <b>He olvidado mi contraseña</b> debajo.</li><li>Haz clic para solicitar una nueva contraseña. Llega por correo.</li></ol><div class="note">No uses passwordreset.microsoftonline.com ni llames al Soporte de IT para esta cuenta — eso solo aplica a los usuarios personales de Dominio Iberia.</div>`,
  authenticatorLinkedQ:'¿Tienes Microsoft Authenticator vinculado a tu cuenta, en un teléfono que tengas contigo?',
  authenticatorLinkedYes:'Sí, está vinculado',
  authenticatorLinkedNo:'No, no está vinculado',
  selfServiceReset:'Restablécela tú mismo en <a href="https://passwordreset.microsoftonline.com/" target="_blank" rel="noopener">passwordreset.microsoftonline.com</a>, aprobando la notificación en tu teléfono.',
  helpdeskIntroUnpair:'Sin el teléfono vinculado a tu MFA, y sin tu contraseña de Dominio Iberia, esto pasa por el Soporte de IT:',
  helpdeskIntroPlain:'Sin Authenticator vinculado, necesitas una contraseña temporal del Soporte de IT:',
  helpdeskFirstUnpair:'<li>Llama al <b>+34 915 874 700</b>, opción Iberia. Identifícate con tu usuario de Dominio Iberia y pide <b>ambas cosas</b>: desemparejar tu antiguo dispositivo de Authenticator, y una contraseña temporal. No menciones AMOS ni ContentManager365.</li>',
  helpdeskFirstPlain:'<li>Llama al <b>+34 915 874 700</b>, opción Iberia. Identifícate con tu usuario de Dominio Iberia y pide una contraseña temporal. No menciones AMOS ni ContentManager365.</li>',
  helpdeskRest:'<li>La contraseña temporal solo te permite establecer una nueva. No da acceso a ninguna aplicación.</li><li>Inicia sesión en <a href="https://account.microsoft.com/account/" target="_blank" rel="noopener">account.microsoft.com/account</a> con tu usuario de Dominio y esa contraseña. Se te pedirá establecer una nueva contraseña y vincular Authenticator: instala la app, pulsa <b>+</b>, elige <b>Cuenta profesional o educativa</b>, escanea el código QR.</li><li>Abre una ventana privada e inicia sesión de nuevo con la contraseña nueva.</li><li>En <b>Información de seguridad</b>, elimina la línea de la contraseña temporal.</li><li>A partir de ahí, restableces tu propia contraseña en <a href="https://passwordreset.microsoftonline.com/" target="_blank" rel="noopener">passwordreset.microsoftonline.com</a>.</li>',

  docunetWhoGeneric:(acc)=>`la cuenta compartida <b>${acc}</b>`,
  docunetWhoDomain:'tu usuario de Dominio Iberia',
  docunetResetGeneric:'<li>¿Has olvidado la contraseña? Al introducir el Código de organización y el Usuario aparece el campo de contraseña, con un enlace <b>He olvidado mi contraseña</b> debajo — haz clic para recibir una nueva por correo.</li>',
  docunetResetDomain:'<li>¿Has olvidado la contraseña? Restablécela tú mismo en <a href="https://passwordreset.microsoftonline.com/" target="_blank" rel="noopener">passwordreset.microsoftonline.com</a> si tienes Authenticator vinculado a tu cuenta; si no, llama al <b>+34 915 874 700</b> (opción Iberia) para pedir una contraseña temporal.</li>',
  docunetMain:(who,resetLine)=>`Esto también cubre los errores <i>ID not recognized</i>, <i>authenticated by your identity provider but could not be found</i>, y <i>no permission — contact your administrator</i>. En los tres casos, el navegador suele haber iniciado sesión con la cuenta de Microsoft equivocada.<ol><li>Abre una ventana privada o de incógnito, para que el navegador no reutilice una cuenta que ya tengas abierta.</li><li>Ve a <a href="https://login.vistair.com/login" target="_blank" rel="noopener">login.vistair.com/login</a>.</li><li>Código de organización <b>IBCM</b>. El código antiguo IBE ya no funciona.</li><li>Inicia sesión con ${who} — no con tu correo de empresa.</li>${resetLine}<li>¿Bloqueado tras varios intentos fallidos? Se libera solo pasados 15 minutos.</li></ol>`,
  docunetNeedsSupport:'Como el restablecimiento automático no lo ha solucionado, esto necesita que lo revise soporte.',

  etlbNoDomain:'Tu estación no tiene cuenta de Dominio Iberia, así que el e-TLB (Aviatar) nunca se inicia directamente aquí — siempre debes solicitar una contraseña de un solo uso a MAINTROL para certificar:<ul><li>Teléfono +34 91 318 93 00 / 01 / 02, o +34 680 99 46 06</li><li>Correo <a href="mailto:MAINTROL@iberia.es">MAINTROL@iberia.es</a></li></ul>Indica la matrícula del avión, y el nombre y correo del certificador (debe ser tu correo personal de empresa, no el genérico de la estación).',
  etlbDomainQ:'El e-TLB (Aviatar) usa el mismo inicio de sesión de Dominio Iberia que ContentManager365 o AirnavX — selecciona <b>Sign in for Iberia</b>. ¿De cuál se trata?',
  etlbSignInProblem:'Un problema de inicio de sesión',
  etlbNoDomainUser:'No tengo usuario de Dominio para el e-TLB',
  etlbSignInForIberiaQ:'¿Estás seleccionando <b>"Sign in for Iberia"</b> en Aviatar al intentar acceder al e-TLB?',
  yes:'Sí',
  noNotSure:'No / no estoy seguro',
  etlbMakeSure:'Asegúrate de seleccionar específicamente <b>"Sign in for Iberia"</b> en Aviatar, y vuelve a intentarlo.',

  amosMsg:'Para organizaciones Part-145 externas, las cuentas de AMOS se desactivan automáticamente tras 3 meses sin uso. Esa suele ser casi siempre la causa.<ol><li>Envía una <a href="https://ibcolumbus.service-now.com/esc?id=sc_cat_item&sys_id=4ceb35932b62a6107924f142de91bfb4" target="_blank" rel="noopener">solicitud de reactivación de AMOS</a>.</li><li>Si sigue fallando tras la reactivación, o el acceso nunca se dio de alta, escribe a <a href="mailto:OutstationsIBOperator@iberia.es">OutstationsIBOperator@iberia.es</a>.</li></ol>',

  onboardingMsg:'Configuración de una cuenta personal de Dominio Iberia por primera vez:<ol><li>Deberías recibir dos correos automáticos de <b>seginf@iberia.es</b> con tu usuario de Dominio y una contraseña temporal. Revisa la carpeta de spam.</li><li>Inicia sesión en <a href="https://account.microsoft.com/account/" target="_blank" rel="noopener">account.microsoft.com/account</a>. Se te pedirá establecer una nueva contraseña y vincular Authenticator: instala la app, pulsa <b>+</b>, elige <b>Cuenta profesional o educativa</b>, escanea el código QR.</li><li>Abre una ventana privada e inicia sesión de nuevo con la contraseña nueva.</li><li>En <b>Información de seguridad</b>, elimina la línea de la contraseña temporal.</li><li>Abre ContentManager365 con el Código de organización <b>IBCM</b> y completa el Read &amp; Sign obligatorio. Desde ahí se accede a los manuales, InfoNotes y demás aplicaciones.</li></ol>Si la contraseña temporal caduca antes, llama al <b>+34 915 874 700</b> (opción Iberia) para pedir una nueva.',

  otpMsg:'Si un certificador no tiene usuario de Dominio Iberia, o la tablet del avión no tiene conectividad, solicita una contraseña de un solo uso a MAINTROL:<ul><li>Teléfono +34 91 318 93 00 / 01 / 02, o +34 680 99 46 06</li><li>Correo <a href="mailto:MAINTROL@iberia.es">MAINTROL@iberia.es</a></li></ul>Indica la matrícula del avión, y el nombre y correo del certificador (debe ser tu correo personal de empresa, no el genérico de la estación).',

  viewerMsg:'Para leer los manuales de ContentManager365 sin conexión:<ol><li>Instala <b>DocuNet Viewer</b> desde la App Store o Google Play.</li><li>Con Wi-Fi o datos móviles, descarga los manuales que necesites. Quedarán disponibles sin conexión.</li></ol>Para leerlos en línea, usa el enlace de DocuNet Viewer que facilita Iberia — no hay que instalar nada.',
  viewerSharedNote:(code)=>`<div class="note">Docunet en tu estación comparte una sola cuenta, así que un bloqueo afecta a todos en ${code}.</div>`,

  userMgmtMsg:'Las altas y bajas de usuarios se hacen mediante el formulario Users Management en ContentManager365/Docunet (debe solicitarlo alguien con Dominio Iberia y acceso a Docunet):<ol><li>Abre una ventana privada o de incógnito, para que el navegador no reutilice una cuenta que ya tengas abierta.</li><li>Ve a <a href="https://docunet-online.vistair.com/" target="_blank" rel="noopener">ContentManager365 (Docunet)</a>.</li><li>Navega por las carpetas: <b>IBERIA</b> &gt; <b>CAMO MANUALS &amp; PROCEDURES</b> &gt; <b>Special Procedures and Forms for external MRO\'s</b> &gt; <b>Forms</b> &gt; <b>Users Management</b>.</li><li>Rellena y envía el formulario con los datos necesarios.</li></ol>',
  userMgmtStillNot:'Para esto, contacta directamente con nosotros, no con el Soporte de IT: <a href="mailto:OutstationsIBOperator@iberia.es">OutstationsIBOperator@iberia.es</a>.',

function stationProfile(code){
  if(!code) return { code:null, domain:true, amos:true, docunetGeneric:null, known:false };
  const domain = AMOS_DOMAIN.includes(code);
  const generic = DOCUNET_GENERIC[code] || null;
  const known = domain || !!generic;
  return {
    code,
    domain: known ? domain : true,      // unlisted codes default to the standard (Domain) setup
    amos: known ? domain : true,
    docunetGeneric: generic,
    known
  };
}

/* ---------- language switcher ---------- */
function buildLangSwitch(container){
  container.innerHTML = '';
  ['en','es','fr'].forEach(code=>{
    const b = document.createElement('button');
    b.textContent = I18N[code].langName;
    if(code === LANG) b.classList.add('active');
    b.onclick = ()=> setLang(code);
    container.appendChild(b);
  });
}
function setLang(code){
  LANG = code;
  buildLangSwitch(document.getElementById('langSwitchGate'));
  buildLangSwitch(document.getElementById('langSwitchDesk'));
  applyStaticText();
  if(station) renderTopics();
  if(station !== null) renderStaCard();
}

const TOPIC_KEYS = [
  { flow:'docunet',       code:'DOC-01',  key:'docunet',       show: ()=>true },
  { flow:'etlb',          code:'TLB-02',  key:'etlb',          show: ()=>true },
  { flow:'amos',          code:'AMS-03',  key:'amos',          show: s=>s.amos },
  { flow:'otp',           code:'OTP-04',  key:'otp',           show: s=>s.domain },
  { flow:'usermgmt',      code:'USR-05',  key:'usermgmt',      show: s=>s.domain },
  { flow:'onboarding',    code:'ONB-06',  key:'onboarding',    show: s=>s.domain },
  { flow:'authenticator', code:'AUTH-07', key:'authenticator', show: s=>s.domain },
  { flow:'viewer',        code:'APP-08',  key:'viewer',        show: ()=>true }
];
const FLOW_FN = {
  authenticator:flowAuthenticator, docunet:flowDocunet, etlb:flowEtlb, cuenta:flowCuenta,
  amos:flowAmos, onboarding:flowOnboarding, otp:flowOtp, viewer:flowViewer, usermgmt:flowUserMgmt
};

function renderTopics(){
  const nav = document.getElementById('topicNav');
  nav.querySelectorAll('.topic').forEach(el=>el.remove());
  TOPIC_KEYS.filter(t=>t.show(station)).forEach(t=>{
    const b = document.createElement('button');
    b.className = 'topic';
    b.innerHTML = '<span class="c">'+t.code+'</span><span>'+S().topics[t.key]+'</span>';
    b.onclick = ()=>{
      FLOW_FN[t.flow]();
      closeTopicsToggle();
    };
    nav.appendChild(b);
  });
  nav.scrollTop = 0;
  nav.classList.add('open');
  document.getElementById('topicsToggle').setAttribute('aria-expanded','true');
}

function closeTopicsToggle(){
  const nav = document.getElementById('topicNav');
  const toggle = document.getElementById('topicsToggle');
  nav.classList.remove('open');
  toggle.setAttribute('aria-expanded','false');
}
document.getElementById('topicsToggle').addEventListener('click', ()=>{
  const nav = document.getElementById('topicNav');
  const toggle = document.getElementById('topicsToggle');
  const isOpen = nav.classList.toggle('open');
  toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
});

function renderStaCard(){
  const s = S();
  const kindLabel = !station.code ? s.noStationSelected
    : station.docunetGeneric ? s.sharedDocunet : s.ibDomain;
  document.getElementById('staBadge').innerHTML = station.code
    ? '<span class="code">'+flagImg(station.code)+' '+station.code+'</span><span class="kind">'+kindLabel+'</span>'
    : '<span class="kind">'+s.noStationSelected+'</span>';

  let cardHtml;
  if(!station.code){
    cardHtml = '<div class="sta-big">—</div><span class="kindtag domain">'+s.noStationSelected+'</span>'
      + '<div class="row"><div class="k">'+s.noteLbl+'</div><div class="v" style="font-weight:400">'+s.answersCoverBoth+'</div></div>';
  } else {
    cardHtml = '<div class="sta-big">'+flagImg(station.code)+' '+station.code+'</div>';
    if(station.docunetGeneric){
      cardHtml += '<span class="kindtag generic">'+s.sharedDocunet+'</span>'
        + '<div class="row"><div class="k">'+s.docunetSignIn+'</div><div class="v">'+station.docunetGeneric+'</div>'
        + '<button class="copy" id="copyBtn">'+s.copyUsername+'</button></div>'
        + '<div class="row"><div class="k">'+s.docunetPwResets+'</div><div class="v" style="font-weight:400">'+s.handledByVistair+'</div></div>';
    } else {
      cardHtml += '<span class="kindtag domain">'+s.personalIbDomain+'</span>'
        + '<div class="row"><div class="k">'+s.signInAs+'</div><div class="v" style="font-weight:400">'+s.personalIbDomainNote+'</div></div>';
    }
    if(station.domain){
      cardHtml += '<div class="row"><div class="k">'+(station.docunetGeneric?s.otherSystems:s.passwordResetsLbl)+'</div><div class="v" style="font-weight:400">'
        + (station.docunetGeneric ? s.amosAuthUseDomain : s.microsoftAuth) + '</div></div>';
    }
  }
  document.getElementById('staCard').innerHTML = cardHtml;

  const cb = document.getElementById('copyBtn');
  if(cb) cb.onclick = ()=>{
    navigator.clipboard.writeText(station.docunetGeneric).then(()=>{
      cb.textContent = s.copied;
      setTimeout(()=>cb.textContent=s.copyUsername,1600);
    }).catch(()=>{ cb.textContent = s.copyFailed; });
  };
}

function enterDesk(code){
  code = (code||'').toUpperCase().trim();
  station = stationProfile(code || null);
  renderStaCard();
  renderTopics();
  gate.style.display = 'none';
  desk.classList.add('on');
  seedConversation();
  greet();
  // Do not auto-focus the free-text field: on mobile this pops the keyboard
  // and hides the issue list. Only do it on wide (desktop) screens.
  if(window.matchMedia('(min-width: 821px)').matches){
    freeInput.focus();
  }
}

document.getElementById('staSkip').onclick = ()=>enterDesk(null);
document.getElementById('switchSta').onclick = ()=>{

};

/* ---------- transcript ---------- */
const threadEl = document.getElementById('thread');
const thinkingEl = document.getElementById('thinking');
const freeInput = document.getElementById('freeInput');
const sendBtn = document.getElementById('sendBtn');

function addMsg(role, html){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if(role === 'bot'){
    const b = document.createElement('div');
    b.className = 'body'; b.innerHTML = html; d.appendChild(b);
  } else { d.innerHTML = html; }
  threadEl.appendChild(d);
  threadEl.scrollTop = threadEl.scrollHeight;

  // Mirror everything shown in the thread (button-driven steps included) into the AI's
  // conversation history, so free text typed later has full context of what was already
  // discussed via the fixed flows — not just the initial station context.
  if(typeof aiConversation !== 'undefined'){
    const plain = String(html).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    if(plain) aiConversation.push({ role: role === 'bot' ? 'assistant' : 'user', content: plain });
  }

  return role === 'bot' ? d.firstChild : d;
}

function addChoices(container, options){
  const w = document.createElement('div');
  w.className = 'choices';
  let used = false;
  options.forEach(o=>{
    const b = document.createElement('button');
    b.textContent = o.label;
    b.onclick = ()=>{
      if(used) return;
      used = true;
      addMsg('user', o.label); w.remove(); o.onClick();
    };
    w.appendChild(b);
  });
  container.appendChild(w);
  threadEl.scrollTop = threadEl.scrollHeight;
}

const resolved = ()=>addMsg('bot', S().resolvedMsg);

function greet(){
  const s = S();
  if(!station.code){
    addMsg('bot', s.greetNoStation+'<div class="note">'+s.greetScopeNote+'</div>');
  } else if(station.docunetGeneric){
    addMsg('bot', s.greetGeneric(station.docunetGeneric));
  } else {
    addMsg('bot', s.greetDomain(station.code));
  }
}

function flowCuenta(escalateFn){
  escalateFn = escalateFn || escalate;
  const s = S();
  addMsg('user', s.userBubble.cuenta);
  if(station.docunetGeneric && station.domain){
    // Mixed case (e.g. MUC): a shared Docunet account AND a personal Domain account both exist.
    const s1 = addMsg('bot','<span class="step-label">PASSWORD RESET</span>'+s.twoLoginsQ);
    addChoices(s1,[

  domainPasswordTree(escalateFn);

/* ---------- free text ---------- */
const KEYWORD_ROUTES = [
  {flow:flowAuthenticator,keywords:['authenticator','new phone','changed phone','change my phone','mobile phone','new device','mfa','autenticador','móvil','telefono','téléphone']},
  {flow:flowOtp,keywords:['otp','one-time password','one time password','no domain user','tablet']},
  {flow:flowViewer,keywords:['docunet viewer','offline','download manuals','without connection','no connection','sin conexión','hors ligne']},
  {flow:flowDocunet,keywords:['docunet','contentmanager','content manager','comply','vistair','ibcm','id not recognized','not recognized','no permission',"don't have permission",'contact your administrator','read and sign','read & sign']},
  {flow:flowEtlb,keywords:['etlb','e-tlb','aviatar','technical logbook']},
  {flow:flowAmos,keywords:['amos']},
  {flow:flowOnboarding,keywords:['new account','first access','first time','onboarding','just joined','new employee','cuenta nueva','nouveau compte']},
  {flow:flowUserMgmt,keywords:['users management','create a user','create user','add a user','remove a user','remove user','delete a user','delete user','eliminate a user','eliminate user','new user','crear usuario','créer un utilisateur']},
  {flow:flowCuenta,keywords:['password','locked','blocked','forgot',"can't sign in",'cannot sign in',"can't log in",'cannot log in','contraseña','olvidé','mot de passe','oublié']}
];
function routeFreeText(t){
  const l = t.toLowerCase();
  for(const r of KEYWORD_ROUTES){ if(r.keywords.some(k=>l.includes(k))) return r.flow; }
  return null;
}

let aiConversation = [];
function seedConversation(){
  aiConversation = [];
  const langLine = 'Always answer in '+S().aiLangName+', regardless of the language used in this context message. ';
  if(!station.code){
    aiConversation.push({role:'user',content:langLine});
    aiConversation.push({role:'assistant',content:'Understood.'});
    return;
  }
  let ctx;
  if(station.docunetGeneric && station.domain){
    ctx = langLine+'Context: I am at station '+station.code+'. Docunet/ContentManager365 signs in with the shared account '
      +station.docunetGeneric+' (organisation code IBCM, Vistair login, reset via the Vistair page, not Microsoft). '
      +'I also have a personal Iberia Domain account for AMOS, e-TLB, Authenticator and password resets. Requests '
      +'to create or remove a personal Domain user must be requested by someone with Iberia Domain and Docunet '
      +'access, through the Users Management form in ContentManager365/'
      +'Docunet (https://docunet-online.vistair.com/, folders: IBERIA > CAMO MANUALS & PROCEDURES > Special Procedures and Forms for external MRO\'s > '
      +'Forms > Users Management). If that fails, contact OutstationsIBOperator@iberia.es directly, not the IT Helpdesk. '
      +'Only ever suggest steps for systems that apply to me. Do not ask me for my station or account type again.';
  } else if(station.docunetGeneric){
    ctx = langLine+'Context: I am at station '+station.code+'. This station has no personal Iberia Domain accounts at all. '
      +'Docunet/ContentManager365 signs in with the shared account '+station.docunetGeneric
      +' (organisation code IBCM, Vistair login, reset via the Vistair page, not Microsoft, no Authenticator). '
      +'This station has no AMOS access. For e-TLB (Aviatar), there is no direct sign-in at all — always request a '
      +'one-time password from MAINTROL to certify (phone +34 91 318 93 00/01/02 or +34 680 99 46 06, email '
      +'MAINTROL@iberia.es, giving the aircraft tail number and the certifier\'s personal company email — not the '
      +'generic station account — plus their name). Iberia does not create individual users for this station, so '
      +'never mention the Users Management form or creating/removing personal users here. Only ever suggest steps '
      +'for systems that apply to me — never suggest AMOS, Authenticator, or personal-Domain-account steps. Do '
      +'not ask me for my station or account type again.';
  } else {
    ctx = langLine+'Context: I am at station '+station.code+', which uses a personal Iberia Domain account for everything '
      +'(Docunet/ContentManager365, e-TLB, AMOS, Authenticator, password resets). Requests to create or remove a '
      +'user must be requested by someone with Iberia Domain and Docunet access, through the Users Management form '
      +'in ContentManager365/Docunet (https://docunet-online.vistair.com/, folders: IBERIA > CAMO MANUALS & '
      +'PROCEDURES > Special Procedures and Forms for external MRO\'s > Forms > Users Management). If that fails, '
      +'contact OutstationsIBOperator@iberia.es directly, not the IT Helpdesk. Do not ask me for my station or '
      +'account type again.';
  }
  aiConversation.push({role:'user',content:ctx});
  aiConversation.push({role:'assistant',content:'Understood. I will use that for the rest of this conversation.'});
}

async function askAI(){
  const r = await fetch(WORKER_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:aiConversation})
  });
  if(!r.ok) throw new Error('Worker request failed: '+r.status);
  const d = await r.json();
  if(!d.answer) throw new Error('Empty answer');
  return d.answer;
}

const KNOWN_DOMAINS = [
  'passwordreset\.microsoftonline\.com',
  'myaccount\.microsoft\.com',
  'account\.microsoft\.com',
  'login\.vistair\.com',
  'docunet-online\.vistair\.com',
  'ibcolumbus\.service-now\.com'
];
const DOMAIN_RE = new RegExp('(?<![\/@.\w-])(' + KNOWN_DOMAINS.join('|') + ')(\/[^\s<)\].,;:]*)?', 'gi');
const BARE_URL_RE = /(^|[\s(])(https?:\/\/[^\s<)]+)/g;

function linkifyPlainSegment(seg){
  seg = seg.replace(BARE_URL_RE, (m, pre, url) => pre + '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
  seg = seg.replace(DOMAIN_RE, (m) => '<a href="https://' + m + '" target="_blank" rel="noopener">' + m + '</a>');
  return seg;
}

function renderAnswer(text){
  let out = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Markdown links, with or without an explicit scheme in the destination.
  out = out.replace(/\[([^\]]+)\]\(((?:https?:\/\/)?[^\s)]+)\)/g, (m, label, dest) => {
    const href = /^https?:\/\//i.test(dest) ? dest : 'https://' + dest;
    return '<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>';
  });

  // Linkify remaining bare URLs/domains, but only in text NOT already inside an <a> tag
  // (avoids wrapping a link's own visible label a second time).
  out = out.split(/(<a\b[^>]*>.*?<\/a>)/g)
    .map(part => part.startsWith('<a') ? part : linkifyPlainSegment(part))
    .join('');

  out = out.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  out = out.replace(/\n/g,'<br>');
  return out;
}

async function handleSend(){
  const q = freeInput.value.trim();
  if(!q) return;
  addMsg('user',q);
  freeInput.value='';
  sendBtn.disabled=true;
  thinkingEl.style.display='flex';
  try{
    const a = await askAI();
    addMsg('bot',renderAnswer(a));
  }catch(e){
    const m = routeFreeText(q);
    if(m){ m(); }
    else{
      addMsg('bot', S().noMatchMsg);
    }
  }finally{
    thinkingEl.style.display='none';
    sendBtn.disabled=false;
  }
}
sendBtn.addEventListener('click',handleSend);
freeInput.addEventListener('keydown',e=>{ if(e.key==='Enter') handleSend(); });
